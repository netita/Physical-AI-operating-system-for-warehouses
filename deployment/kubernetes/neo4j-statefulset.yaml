# ============================================================
# Neo4j StatefulSet — Spatial knowledge graph for warehouse topology
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: warehousegpt
  labels:
    app: neo4j
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/component: graph-database
    app.kubernetes.io/part-of: physical-ai-os
  annotations:
    description: "Neo4j 5 Enterprise — spatial knowledge graph for warehouse layout, robot relationships, and incident causality"
spec:
  serviceName: neo4j
  replicas: 3  # Neo4j Causal Cluster: 1 leader + 2 followers
  selector:
    matchLabels:
      app: neo4j
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: neo4j
        app.kubernetes.io/name: neo4j
        app.kubernetes.io/component: graph-database
        app.kubernetes.io/part-of: physical-ai-os
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2004"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - neo4j
              topologyKey: kubernetes.io/hostname
      serviceAccountName: warehousegpt-workload
      securityContext:
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474

      containers:
        - name: neo4j
          image: neo4j:5.19-enterprise
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 7474
              protocol: TCP
            - name: https
              containerPort: 7473
              protocol: TCP
            - name: bolt
              containerPort: 7687
              protocol: TCP
            - name: discovery
              containerPort: 5000
              protocol: TCP
            - name: transaction
              containerPort: 6000
              protocol: TCP
            - name: raft
              containerPort: 7000
              protocol: TCP
            - name: metrics
              containerPort: 2004
              protocol: TCP
            - name: backup
              containerPort: 6362
              protocol: TCP

          env:
            # Auth
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: warehousegpt-secrets
                  key: neo4j_auth
            - name: NEO4J_ACCEPT_LICENSE_AGREEMENT
              value: "yes"

            # Causal cluster settings
            - name: NEO4J_causal__clustering_expected__core__cluster__size
              value: "3"
            - name: NEO4J_causal__clustering_initial__discovery__members
              value: "neo4j-0.neo4j.warehousegpt.svc.cluster.local:5000,neo4j-1.neo4j.warehousegpt.svc.cluster.local:5000,neo4j-2.neo4j.warehousegpt.svc.cluster.local:5000"
            - name: NEO4J_causal__clustering_discovery__advertised__address
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NEO4J_causal__clustering_transaction__advertised__address
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            # Bolt advertised address (uses pod DNS)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NEO4J_dbms_connector_bolt_advertised__address
              value: "$(POD_NAME).neo4j.warehousegpt.svc.cluster.local:7687"

            # Memory tuning (for 32Gi container)
            - name: NEO4J_dbms_memory_heap_initial__size
              value: "8g"
            - name: NEO4J_dbms_memory_heap_max__size
              value: "16g"
            - name: NEO4J_dbms_memory_pagecache_size
              value: "8g"
            - name: NEO4J_dbms_memory_transaction_global__max__size
              value: "2g"

            # Plugins: APOC + GDS (Graph Data Science) + Spatial
            - name: NEO4J_PLUGINS
              value: '["apoc", "graph-data-science"]'
            - name: NEO4J_apoc_export_file_enabled
              value: "true"
            - name: NEO4J_apoc_import_file_enabled
              value: "true"
            - name: NEO4J_apoc_import_file_use__neo4j__config
              value: "true"
            - name: NEO4JLABS_PLUGINS
              value: '["apoc-extended"]'

            # Metrics (Prometheus format)
            - name: NEO4J_metrics_prometheus_enabled
              value: "true"
            - name: NEO4J_metrics_prometheus_endpoint
              value: "0.0.0.0:2004"
            - name: NEO4J_metrics_enabled
              value: "true"
            - name: NEO4J_metrics_jmx_enabled
              value: "false"

            # Logging
            - name: NEO4J_dbms_logs_query_enabled
              value: "INFO"
            - name: NEO4J_dbms_logs_query_threshold
              value: "1000ms"

            # Security
            - name: NEO4J_dbms_security_procedures_unrestricted
              value: "apoc.*,gds.*"
            - name: NEO4J_dbms_security_procedures_allowlist
              value: "apoc.*,gds.*"

          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 32Gi

          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
            - name: plugins
              mountPath: /plugins
            - name: import
              mountPath: /import

          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /db/neo4j/cluster/available
              port: 7474
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10

          startupProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 20

      volumes:
        - name: plugins
          emptyDir: {}
        - name: import
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: neo4j
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3-encrypted
        resources:
          requests:
            storage: 500Gi
    - metadata:
        name: logs
        labels:
          app: neo4j
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3-encrypted
        resources:
          requests:
            storage: 50Gi

---
# Headless service for cluster discovery
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: warehousegpt
  labels:
    app: neo4j
    app.kubernetes.io/component: graph-database
spec:
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: https
      port: 7473
      targetPort: 7473
    - name: bolt
      port: 7687
      targetPort: 7687
    - name: discovery
      port: 5000
      targetPort: 5000
    - name: transaction
      port: 6000
      targetPort: 6000
    - name: raft
      port: 7000
      targetPort: 7000
    - name: metrics
      port: 2004
      targetPort: 2004
    - name: backup
      port: 6362
      targetPort: 6362
  clusterIP: None

---
# Client-facing bolt service (load-balanced)
apiVersion: v1
kind: Service
metadata:
  name: neo4j-bolt
  namespace: warehousegpt
  labels:
    app: neo4j
    role: client
spec:
  selector:
    app: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
    - name: http
      port: 7474
      targetPort: 7474
  type: ClusterIP
  sessionAffinity: ClientIP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neo4j-pdb
  namespace: warehousegpt
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: neo4j

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    system: warehousegpt
    env: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
      timeout: 10s

scrape_configs:

  # Digital Twin API — runs on host, port 8003
  - job_name: digital_twin_api
    static_configs:
      - targets: ["172.17.0.1:8003"]
        labels:
          service: digital-twin-api
    metrics_path: /metrics/

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # OpenTelemetry Collector self-metrics
  - job_name: otel_collector
    static_configs:
      - targets: ["otel-collector:8888"]

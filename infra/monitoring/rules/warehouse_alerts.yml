groups:
  - name: warehouse_safety
    interval: 15s
    rules:

      - alert: HighIncidentRate
        expr: rate(warehouse_incidents_total[5m]) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High safety incident rate"
          description: "More than 0.5 incidents/s over the last 5 minutes (current: {{ $value | humanize }}/s)"

      - alert: CriticalIncident
        expr: increase(warehouse_incidents_total{severity="critical"}[1m]) > 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Critical safety incident detected"
          description: "A critical incident of type {{ $labels.incident_type }} was detected"

      - alert: FireDetected
        expr: increase(warehouse_fires_detected_total[1m]) > 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Fire detected in warehouse"
          description: "Fire detection triggered on camera {{ $labels.camera_id }}"

      - alert: NoAgentsVisible
        expr: warehouse_agents_total == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "No agents tracked in warehouse"
          description: "Digital twin has been reporting 0 agents for more than 2 minutes"

      - alert: DigitalTwinAPIDown
        expr: up{job="digital_twin_api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Digital Twin API is unreachable"
          description: "Prometheus cannot scrape {{ $labels.instance }}"

      - alert: HighInjectLatency
        expr: histogram_quantile(0.95, rate(warehouse_inject_latency_seconds_bucket[5m])) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Slow /inject endpoint"
          description: "p95 latency is {{ $value | humanizeDuration }} (threshold 500 ms)"

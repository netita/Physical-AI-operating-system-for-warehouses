<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WarehouseGPT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────────── */
    .sidebar {
      width: 260px;
      background: #1a1d27;
      border-right: 1px solid #2d3148;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 12px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 4px 16px;
      border-bottom: 1px solid #2d3148;
      margin-bottom: 4px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #f97316, #ef4444);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo-text { font-size: 16px; font-weight: 700; color: #f1f5f9; }
    .logo-sub  { font-size: 11px; color: #64748b; margin-top: 1px; }

    .new-chat-btn {
      background: #f97316;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .new-chat-btn:hover { background: #ea6c0a; }

    .sidebar-section {
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 4px 0;
    }

    .quick-btn {
      background: transparent;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 9px 12px;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      line-height: 1.3;
    }
    .quick-btn:hover { background: #242738; border-color: #f97316; color: #f1f5f9; }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
    .status-dot.offline { background: #ef4444; animation: none; }

    .connection-status {
      margin-top: auto;
      font-size: 12px;
      color: #475569;
      padding: 8px 4px;
      border-top: 1px solid #2d3148;
    }

    /* ── Main chat area ──────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid #2d3148;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1d27;
    }

    .chat-header h1 { font-size: 16px; font-weight: 600; }
    .model-badge {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      color: #94a3b8;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 3px; }

    /* Welcome state */
    .welcome {
      text-align: center;
      padding: 60px 20px;
      max-width: 480px;
      margin: 0 auto;
    }
    .welcome-icon { font-size: 48px; margin-bottom: 16px; }
    .welcome h2  { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .welcome p   { color: #64748b; font-size: 14px; line-height: 1.6; }

    /* Messages */
    .msg {
      display: flex;
      gap: 12px;
      max-width: 820px;
      width: 100%;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .msg.user .avatar     { background: #1e3a5f; }
    .msg.assistant .avatar { background: linear-gradient(135deg, #f97316, #ef4444); }

    .bubble {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.65;
      max-width: calc(100% - 50px);
    }
    .msg.user .bubble {
      background: #1e3a5f;
      border-color: #2563eb44;
    }

    .bubble strong { font-weight: 700; color: #f1f5f9; }
    .bubble code {
      background: #0f1117;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
      color: #f97316;
    }

    .tools-used {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .tool-chip {
      background: #0f1117;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tool-chip::before { content: "⚙"; font-size: 10px; }

    .meta {
      font-size: 11px;
      color: #475569;
      margin-top: 8px;
      display: flex;
      gap: 12px;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }
    .typing-indicator span {
      width: 7px; height: 7px;
      background: #64748b;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    /* Cursor blink */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 14px;
      background: #f97316;
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Safety alert */
    .safety-alert {
      background: #450a0a;
      border: 1px solid #ef4444;
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 8px;
      font-size: 13px;
      color: #fca5a5;
    }

    /* ── Input area ──────────────────────────────────────── */
    .input-area {
      padding: 16px 24px 20px;
      border-top: 1px solid #2d3148;
      background: #1a1d27;
    }

    .input-wrap {
      display: flex;
      gap: 10px;
      background: #242738;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 10px 14px;
      transition: border-color 0.15s;
    }
    .input-wrap:focus-within { border-color: #f97316; }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e2e8f0;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      line-height: 1.5;
      max-height: 140px;
      min-height: 24px;
    }
    textarea::placeholder { color: #475569; }

    .send-btn {
      background: #f97316;
      border: none;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      align-self: flex-end;
      transition: background 0.15s;
      font-size: 16px;
    }
    .send-btn:hover:not(:disabled) { background: #ea6c0a; }
    .send-btn:disabled { background: #374151; cursor: not-allowed; }

    .input-hint {
      font-size: 11px;
      color: #334155;
      margin-top: 6px;
      text-align: center;
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="logo">
    <div class="logo-icon">🏭</div>
    <div>
      <div class="logo-text">WarehouseGPT</div>
      <div class="logo-sub">Physical AI OS</div>
    </div>
  </div>

  <button class="new-chat-btn" onclick="newChat()">
    <span>+</span> New conversation
  </button>

  <div class="sidebar-section">Quick queries</div>

  <button class="quick-btn" onclick="sendQuick('Which forklifts are highest risk right now?')">
    Which forklifts are highest risk?
  </button>
  <button class="quick-btn" onclick="sendQuick('Are there any low stock items I should know about?')">
    Any low stock alerts?
  </button>
  <button class="quick-btn" onclick="sendQuick('What is the current status of all active orders?')">
    Status of active orders
  </button>
  <button class="quick-btn" onclick="sendQuick('Run a full system diagnostic and report any issues.')">
    Run system diagnostic
  </button>
  <button class="quick-btn" onclick="sendQuick('What are the OSHA regulations for forklift pedestrian separation?')">
    Forklift safety regulations
  </button>
  <button class="quick-btn" onclick="sendQuick('Suggest layout optimizations to improve warehouse throughput.')">
    Optimize warehouse layout
  </button>

  <div class="connection-status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Connecting...</span>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="chat-header">
    <h1>Warehouse Operations Assistant</h1>
    <span class="model-badge" id="modelBadge">GPT-4o</span>
  </div>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">🏭</div>
      <h2>WarehouseGPT</h2>
      <p>Ask me anything about your warehouse — robot fleet status, inventory levels, safety incidents, order fulfillment, or layout optimization.</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea
        id="input"
        placeholder="Ask about robots, inventory, orders, safety..."
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
        &#9658;
      </button>
    </div>
    <div class="input-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>
  </div>
</div>

<script>
  let ws = null;
  let sessionId = null;
  let isStreaming = false;
  let currentBubble = null;
  let currentText = '';
  let streamStart = 0;

  function connect() {
    const wsUrl = `ws://${location.host}/chat`;
    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      setStatus(true);
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      handleWsMessage(data);
    };

    ws.onclose = () => {
      setStatus(false);
      setTimeout(connect, 3000);
    };

    ws.onerror = () => {
      setStatus(false);
    };
  }

  function setStatus(online) {
    const dot  = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    if (online) {
      dot.className  = 'status-dot';
      text.textContent = 'Connected';
    } else {
      dot.className  = 'status-dot offline';
      text.textContent = 'Reconnecting...';
    }
  }

  function handleWsMessage(data) {
    if (data.type === 'chunk') {
      if (!currentBubble) {
        removeTyping();
        currentBubble = createAssistantBubble();
        currentText   = '';
        streamStart   = Date.now();
      }
      currentText += data.content;
      renderBubbleText(currentBubble, currentText, true);
      sessionId = data.session_id;
      scrollToBottom();
    }

    if (data.type === 'done') {
      if (currentBubble) {
        renderBubbleText(currentBubble, currentText, false);
        const latency = ((Date.now() - streamStart) / 1000).toFixed(1);
        appendMeta(currentBubble, latency);
        currentBubble = null;
        currentText   = '';
      }
      isStreaming = false;
      setInputEnabled(true);
      scrollToBottom();
    }

    if (data.type === 'error') {
      removeTyping();
      appendError(data.content || 'An error occurred.');
      isStreaming = false;
      setInputEnabled(true);
    }
  }

  function sendMessage() {
    const input = document.getElementById('input');
    const text  = input.value.trim();
    if (!text || isStreaming || !ws || ws.readyState !== WebSocket.OPEN) return;

    // Hide welcome
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    appendUserMessage(text);
    input.value = '';
    autoResize(input);

    isStreaming = true;
    setInputEnabled(false);
    appendTyping();

    ws.send(JSON.stringify({ message: text, session_id: sessionId }));
    scrollToBottom();
  }

  function sendQuick(text) {
    document.getElementById('input').value = text;
    sendMessage();
  }

  function newChat() {
    sessionId = null;
    currentBubble = null;
    currentText   = '';
    const msgs = document.getElementById('messages');
    msgs.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🏭</div>
        <h2>WarehouseGPT</h2>
        <p>Ask me anything about your warehouse — robot fleet status, inventory levels, safety incidents, order fulfillment, or layout optimization.</p>
      </div>`;
  }

  // ── DOM helpers ─────────────────────────────────────────

  function appendUserMessage(text) {
    const msgs = document.getElementById('messages');
    const div  = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `
      <div class="avatar">👤</div>
      <div class="bubble">${escHtml(text)}</div>`;
    msgs.appendChild(div);
  }

  function createAssistantBubble() {
    const msgs = document.getElementById('messages');
    const div  = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble" id="streaming-bubble"></div>`;
    msgs.appendChild(div);
    return div.querySelector('#streaming-bubble');
  }

  function renderBubbleText(bubble, text, streaming) {
    const html = formatText(text);
    bubble.innerHTML = html + (streaming ? '<span class="cursor"></span>' : '');

    // Highlight safety alerts
    if (text.includes('[SAFETY ALERT]')) {
      bubble.innerHTML += `<div class="safety-alert">⚠ Safety alert detected — review immediately.</div>`;
    }
  }

  function appendMeta(bubble, latency) {
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${latency}s`;
    bubble.parentElement.appendChild(meta);
  }

  function appendTyping() {
    const msgs = document.getElementById('messages');
    const div  = document.createElement('div');
    div.className = 'msg assistant';
    div.id = 'typing';
    div.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble">
        <div class="typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>`;
    msgs.appendChild(div);
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function appendError(msg) {
    const msgs = document.getElementById('messages');
    const div  = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = `
      <div class="avatar">⚠</div>
      <div class="bubble" style="border-color:#ef444444;color:#fca5a5">${escHtml(msg)}</div>`;
    msgs.appendChild(div);
  }

  // ── Formatting ───────────────────────────────────────────

  function formatText(text) {
    return escHtml(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');
  }

  function escHtml(s) {
    return s
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Input helpers ────────────────────────────────────────

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function setInputEnabled(enabled) {
    document.getElementById('input').disabled   = !enabled;
    document.getElementById('sendBtn').disabled = !enabled;
  }

  function scrollToBottom() {
    const msgs = document.getElementById('messages');
    msgs.scrollTop = msgs.scrollHeight;
  }

  connect();
</script>
</body>
</html>
